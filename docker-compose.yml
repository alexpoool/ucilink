# Compose de desarrollo Monta Postgres + backend (webapi) + webapp.
# El esquema base (usuario, aspirante, empresa, ...) se monta en PostgreSQL
# vía docker-entrypoint-initdb.d. Cambios de esquema avanzan SOLO con
# migraciones up()/down() (npm run db:migrate).
services:
  db:
    build: ./db
    container_name: ucilink-db
    environment:
      POSTGRES_USER: ucilink
      POSTGRES_PASSWORD: ucilink_secret
      POSTGRES_DB: ucilink
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "25032:5432" # 5432 del host LO OCUPA un postgres local — compose expone 25032; el backend conecta por la red interna (db:5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucilink -d ucilink"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: ucilink-backend
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://ucilink:ucilink_secret@db:5432/ucilink
      JWT_SECRET: docker-jwt-secret-cambiar-en-prod
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      # Volumen persistente para archivos (CVs PDF, logos): /data/uploads
      UPLOADS_DIR: /data/uploads
      UPLOAD_MAX_BYTES: "10485760"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    # Aplica migraciones pendientes (incluye notificacion) y levanta el server.
    # runner.js compila a dist/migrations porque tsconfig incluye migrations/.
    command: >
      sh -c "node dist/migrations/runner.js up &&
             node dist/src/server.js"

  webapp:
    build: ./webapp
    container_name: ucilink-webapp
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
